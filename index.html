<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Forms</title>
</head>
<body>
    Registration Details<br>
    <form action="script.php" method="get">
        <input type="text" name="name" placeholder="Name" required><br>
        <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy" required><br>
        <input type="email" name="email" placeholder="Email address" required><br>
        Select your photo.<input type="file" name="file" accept="img/*"><br>
        <textarea name="address" id="address" rows="4" cols="30" placeholder="Address"></textarea><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
